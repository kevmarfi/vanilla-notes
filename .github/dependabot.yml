version: 2

updates:
  # Packages of the projects, and the SDK pinned in global.json
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

  # Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
